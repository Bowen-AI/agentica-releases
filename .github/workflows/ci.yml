name: Installer tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n install.sh && bash -n docs/install.sh
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
